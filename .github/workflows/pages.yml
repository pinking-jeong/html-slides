# decks/ 가 바뀔 때마다 갤러리(목록·첫 장 그림)를 새로 만들어 GitHub Pages 에 올린다.
# 저장소 Settings → Pages → Source 는 "GitHub Actions" 여야 한다(브랜치에서 바로 배포하면
# 검색 제외 표시·숨김 처리 없이 저장소가 그대로 공개된다).
name: 갤러리 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}            # 일마다 필요한 권한만 아래에서 따로 준다

# 한 번에 하나만 배포한다. 진행 중인 배포는 끝까지 두고, 그 사이 쌓인 것은 마지막 것만 돌린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 버전을 고정한다 — ubuntu-latest 가 바뀌면 apt 글꼴·Playwright 의 --with-deps 가 새 OS 를 몰라 깨질 수 있다.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read       # 덱을 렌더링하는 이 단계에는 배포 권한을 주지 않는다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0            # 덱마다 처음 올린 때·마지막으로 고친 때를 git 기록에서 읽는다
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # 남는 위험: 아래 apt 글꼴과 Playwright 의 Chromium 은 그때그때 받는다(버전 고정·해시 확인 없음).
      # 이 단계에는 비밀이 없고(GITHUB_TOKEN 도 넘기지 않음) 배포 권한도 없어, 오염돼도 미치는 곳은 사이트 내용뿐이다.
      - name: 한글 글꼴
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Playwright 준비(버전·파일 해시 고정)
        run: |
          python -m pip install --quiet --require-hashes -r tools/requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: 미리보기 캐시 가져오기
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .thumbcache
          key: thumbs-${{ github.sha }}
          restore-keys: thumbs-

      - name: 사이트 만들기
        run: python -X utf8 tools/build_manifest.py --out _site --thumbs --cache .thumbcache

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
